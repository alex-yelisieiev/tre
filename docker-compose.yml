services:
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: axs-scraper:latest

    # Chrome needs a large /dev/shm to avoid GPU crashes
    shm_size: "2gb"

    volumes:
      # Screenshots and logs written here by the scraper
      - ./output:/app/output
      # The provided IPRoyal proxy list (read-only)
      - ./test_data/iproyal-proxies (1).txt:/app/proxies.txt:ro
      # Persist the CloakBrowser stealth binary between runs (saves ~3min download)
      - cb-cache:/home/scraper/.cache/cloakbrowser

    environment:
      # ── Target URLs (comma-separated) ───────────────────────────────────────
      TARGET_URLS: >-
        https://shop.axs.com/?c=axs&e=6414022407626854,
        https://shop.axs.com/?c=axs&e=4436620017755968

      # ── Proxy settings ───────────────────────────────────────────────────────
      PROXY_FILE: /app/proxies.txt
      PROXY_TYPE: http            # http | https | socks5

      # ── Action ───────────────────────────────────────────────────────────────
      ACTION: both                # screenshot | add_to_cart | both

      # ── Browser behaviour ────────────────────────────────────────────────────
      # headless=false + Xvfb (set in entrypoint) gives the best CF bypass rate
      HEADLESS: "false"
      HUMANIZE: "true"
      GEOIP: "true"
      PAGE_TIMEOUT: "60000"       # ms

      # ── Retry ────────────────────────────────────────────────────────────────
      MAX_RETRIES: "3"

      # ── Cloudflare wait ───────────────────────────────────────────────────────
      # How long (seconds) to wait for the CF challenge to auto-resolve
      CF_WAIT_TIMEOUT: "90"

      # Suppress Windows font warning (fonts are installed in the image)
      CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"

      # ── CloakBrowser Pro license ─────────────────────────────────────────────
      CLOAKBROWSER_LICENSE_KEY: cb_882b50e71b39490fa6abcbf1723e8de0

      # ── Output ───────────────────────────────────────────────────────────────
      OUTPUT_DIR: /app/output

    restart: "no"

volumes:
  # Named volume so the CloakBrowser binary persists between docker-compose up runs
  cb-cache:
